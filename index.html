<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>kirimWA Emergency v2.3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #25D366; --dark: #128C7E; --bg: #ece5dd; --blue: #2563EB; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; min-height: 100vh; font-size: 16px; }
        
        /* EMERGENCY LOADING SCREEN */
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-cancel-load { background: #ddd; color: #333; padding: 10px 30px; border-radius: 20px; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
        
        /* SCREEN & HEADER */
        .screen { display: none; padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        .header { background: var(--primary); color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .menu-btn { background: none; border: none; color: white; padding: 5px 10px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .header-title { cursor: pointer; text-align: right; }
        .menu-popup { display: none; position: absolute; top: 45px; left: 10px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 8px; width: 220px; z-index: 110; }
        .menu-popup.active { display: block; }
        .menu-item { display: block; padding: 15px; color: #333; border-bottom: 1px solid #eee; cursor: pointer; text-decoration: none; }
        .menu-item.logout { color: red; }
        
        /* COMPONENTS */
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        button { cursor: pointer; padding: 12px; border: none; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; font-family: 'Poppins', sans-serif; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #ddd; color: #333; }
        .btn-danger { background: #ff4444; color: white; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* NIAGA STYLES */
        body.niaga-bg { background-color: #f0f2f5; }
        .niaga-header { background: var(--blue); }
        .niaga-header .menu-btn, .niaga-header .header-title { color: white; }
        .feed-card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; overflow: hidden; }
        .feed-header { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
        .feed-body { padding: 15px; }
        .feed-footer { padding: 10px 15px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; }
        .btn-wa { background: #25D366; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; width: auto; }
        .btn-toko { background: #2563EB; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; width: auto; }
        .carousel-container { position: relative; width: 100%; overflow: hidden; }
        .carousel-slide { display: flex; transition: transform 0.3s; }
        .carousel-slide img { width: 100%; height: 200px; object-fit: cover; flex-shrink: 0; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 10px 5px; cursor: pointer; z-index: 5; }
        .carousel-btn.prev { left: 0; border-radius: 0 5px 5px 0; }
        .carousel-btn.next { right: 0; border-radius: 5px 0 0 5px; }
        
        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1050; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; width: 100%; height: 100%; overflow-y: auto; }
        .modal-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 10; }
        .modal-body { padding: 15px; }
        
        /* MISC */
        .fab-post { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; background-color: var(--blue); color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; z-index: 50; border: none; }
        .detail-slider-container { position: relative; width: 100%; background: #000; }
        .detail-slider { display: flex; width: 100%; overflow: hidden; }
        .detail-slide { min-width: 100%; display: flex; justify-content: center; align-items: center; }
        .detail-slide img { width: 100%; height: auto; max-height: 60vh; object-fit: contain; }
        .detail-nav { position: absolute; top: 50%; background: rgba(255,255,255,0.7); color: #000; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 10; font-weight: bold; }
        .detail-nav.left { left: 10px; }
        .detail-nav.right { right: 10px; }
        .store-header-bg { background: linear-gradient(to right, #3b82f6, #1d4ed8); height: 100px; position: relative; }
        .store-avatar { width: 80px; height: 80px; background: white; border-radius: 50%; border: 4px solid white; position: absolute; bottom: -40px; left: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: var(--blue); font-weight: bold; }
        .banner-track { display: flex; overflow-x: auto; scrollbar-width: none; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN WITH CANCEL BUTTON -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p id="loadingText">Memuat Aplikasi...</p>
        <button class="btn-cancel-load" onclick="forceStartApp()">Batal / Lewati</button>
    </div>

    <div class="header" id="mainHeader" style="display:none;">
        <button type="button" class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
        <div class="header-title" onclick="navigateHome()">
            <span style="font-weight:700; font-style:italic;">kirimWA</span> <span style="font-size:12px; font-style:italic;">v2.3</span>
        </div>
        <div class="menu-popup" id="menuPopup">
            <div id="dynamicMenu"></div>
            <span class="menu-item logout" onclick="logout()">Logout</span>
        </div>
    </div>

    <!-- SCREENS HTML -->
    <div class="screen" id="screenLogin"><div class="card" style="margin-top:20px; overflow:hidden; padding:0;"><div style="background:#f0f0f0;"><img src="https://i.ibb.co.com/VWg4bJHp/Login-page-1.jpg" style="width: 100%; display: block;"></div><div style="padding:20px;"><h2 style="text-align:center;">Login</h2><form onsubmit="event.preventDefault(); handleLogin();"><input type="email" id="loginEmail" placeholder="Email"><div style="position:relative;"><input type="password" id="loginPass" placeholder="Password"><span onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'" style="position:absolute;right:15px;top:12px;cursor:pointer;">👁️</span></div><button type="submit" class="btn-primary">Login</button></form><p style="text-align:center; margin-top:15px;">Belum punya akun? <a href="#" onclick="navigateTo('register');return false;">Register</a></p></div><div style="background:#fafafa;"><img src="https://i.ibb.co.com/KjP9hNp0/Login-page-2.jpg" style="width: 100%; display: block;"></div></div></div>
    <div class="screen" id="screenRegister"><div class="card" style="margin-top:20px; overflow:hidden; padding:0;"><div style="padding:20px;"><h2>Register</h2><input type="text" id="regUser" placeholder="Username"><input type="email" id="regEmail" placeholder="Email"><input type="text" id="regWa" placeholder="WA"><div style="position:relative;"><input type="password" id="regPass" placeholder="Password"><span onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'" style="position:absolute;right:15px;top:12px;cursor:pointer;">👁️</span></div><button class="btn-primary" onclick="handleRegister()">Register</button><p style="text-align:center; margin-top:15px;"><a href="#" onclick="navigateTo('login');return false;">Login</a></p></div></div></div>
    <div class="screen" id="screenReset"><div class="card" style="margin-top:50px;"><h2>Reset Password</h2><input type="password" id="newPass" placeholder="Password Baru"><button class="btn-primary" onclick="updateNewPassword()">Simpan</button></div></div>
    <div class="screen" id="screenAkun"><h2>Akun Saya</h2><div id="akunGuest" class="card" style="text-align:center; display:none;"><h3>Selamat Datang</h3><button class="btn-primary" onclick="navigateTo('login')">Login</button></div><div id="akunUser" style="display:none;"><div class="card"><p><strong>Username:</strong> <span id="profUsername">-</span></p><p><strong>Email:</strong> <span id="profEmail">-</span></p><p><strong>Status:</strong> <span id="profStatus">-</span></p><hr><input type="text" id="editWa" placeholder="WA"><button class="btn-secondary" onclick="updateProfile()">Simpan WA</button><br><br><input type="password" id="editPass" placeholder="Password Baru"><button class="btn-secondary" onclick="updatePassword()">Simpan Pass</button><br><br><button class="btn-danger" onclick="deleteAccount()">Hapus Akun</button></div></div></div>
    <div class="screen" id="screenKontak"><h2>Kontak</h2><div class="card"><input type="text" id="cName" placeholder="Nama"><input type="text" id="cPhone" placeholder="HP"><input type="text" id="cLocation" placeholder="Lokasi"><button class="btn-primary" onclick="addContact()">Simpan</button></div><div id="contactListContainer"></div></div>
    <div class="screen" id="screenKirim"><h2>Kirim Pesan</h2><div class="card"><textarea id="messageText" rows="2"></textarea></div><div id="availableContactsList"></div><div class="card"><h3>List (<span id="countSend">0</span>)</h3><div id="sendListDisplay"></div><button class="btn-primary" id="btnSendNext" onclick="sendNextInQueue()" style="display:none;">Kirim</button></div></div>
    <div class="screen" id="screenNiaga"><div class="bg-white shadow-sm py-3 px-4 mb-2 border-b"><select id="filterProvinsi" class="border rounded px-2 py-2 text-xs w-full bg-white"><option value="">Provinsi</option></select><button onclick="loadFeed()" class="w-full bg-blue-500 text-white px-4 py-2 rounded text-sm font-medium mt-2">Filter</button></div><div id="feedContainer"></div></div>
    <div class="screen" id="screenToko"><div class="bg-white shadow-sm"><div class="store-header-bg relative"><div class="store-avatar" id="storeAvatar">T</div></div><div class="pt-12 px-4 pb-4"><h2 id="storeName" class="text-xl font-bold">Nama Toko</h2><p id="storeAddress" class="text-sm text-gray-500">Alamat</p><div class="mt-3 flex gap-2"><button id="storeWaBtn" class="flex-1 bg-green-500 text-white py-2 rounded-lg text-sm font-medium">Chat Toko</button></div></div></div><div class="mt-4 px-4"><h3 class="text-lg font-bold mb-3">Produk</h3><div id="productContainer" class="grid grid-cols-2 gap-4"></div></div></div>
    <div class="screen" id="screenAdmin"><h2 style="color:#ffc107;">Admin</h2><div class="card"><div class="grid grid-cols-3 gap-2 text-center"><div class="bg-white p-2 rounded shadow-sm"><div class="text-2xl font-bold text-green-600" id="metricFeedWa">0</div><div class="text-xs">WA</div></div></div></div><div class="card"><div class="counter-badge" id="adminCount">Total: 0</div></div><div class="card"><h3>User</h3><div class="scroll-list-container" id="adminUserList" style="max-height:300px;overflow:auto;"></div></div></div>

    <!-- MODALS -->
    <div id="postModal" class="modal-overlay"><div class="modal-box"><div class="modal-header"><h3 id="modalTitle">Modal</h3><button onclick="closePostModal()" style="background:none;border:none;font-size:24px;">&times;</button></div><div class="modal-body"><input type="text" id="inputTitle" placeholder="Judul"><textarea id="inputDesc" rows="2"></textarea><input type="file" id="inputImages" multiple accept="image/*"><input type="text" id="inputPrice" placeholder="Harga" style="display:none"><button id="btnSubmit" onclick="submitPost()" class="btn-primary">Submit</button></div></div></div>
    <div id="detailModal" class="modal-overlay"><div class="modal-box"><div class="modal-header"><h3 id="detailTitle">Detail</h3><button onclick="closeDetailModal()" style="background:none;border:none;font-size:24px;">&times;</button></div><div class="modal-body" style="padding:0;"><div class="detail-slider-container"><div class="detail-slider" id="detailSlider"></div><button class="detail-nav left" onclick="moveDetailSlide(-1)">❮</button><button class="detail-nav right" onclick="moveDetailSlide(1)">❯</button></div><div style="padding:15px;"><p id="detailDesc" style="white-space:pre-wrap;"></p><div style="margin-top:15px;display:flex;gap:10px;"><button id="detailBtnWa" class="btn-wa">WhatsApp</button><button id="detailBtnStore" class="btn-toko">Lihat Toko</button></div></div></div></div></div>
    
    <button id="fabPost" class="fab-post" onclick="showPostModal()" style="display:none;">+</button>

    <script>
        // === 1. GLOBAL EMERGENCY FUNCTIONS (Paling Atas) ===
        // Fungsi ini bisa dipanggil kapan saja untuk memaksa masuk ke Login
        function forceStartApp() {
            try { document.getElementById('loadingScreen').style.display = 'none'; } catch(e){}
            try { showScreen('screenLogin'); } catch(e){}
        }
        // Timer otomatis 5 detik
        var failSafeTimer = setTimeout(forceStartApp, 5000);

        // === 2. KONFIGURASI ===
        const SUPABASE_URL = 'https://whlyxdcsrvrpxmdsfdjz.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndobHl4ZGNzcnZycHhtZHNmZGp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzODY3OTYsImV4cCI6MjA4ODk2Mjc5Nn0.A4SFdoE72-xNn99ez9Ug5R1fndrcTu4GhYy9Mpe1Zfk';
        
        // Cek jika library gagal load
        if (typeof supabase === 'undefined') {
            document.getElementById('loadingText').innerText = "Error: Koneksi Blokir";
            document.querySelector('.btn-cancel-load').innerText = "Coba Lagi";
            // Hentikan eksekusi di sini, user harus klik Batal
            throw new Error("Library Supabase tidak ditemukan");
        }

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null; let currentRole = 'user'; let isActive = false; let isStoreActive = false; 
        let allContacts = []; let sendList = []; let currentDetailImages = []; let currentDetailIndex = 0;

        // === 3. UI CONTROL (Hardened) ===
        function showScreen(id) {
            clearTimeout(failSafeTimer); // Matikan timer jika berhasil
            try { document.getElementById('loadingScreen').style.display = 'none'; } catch(e){}
            
            // Paksa SEMUA screen none (Anti Tumpuk)
            var allScreens = document.getElementsByClassName('screen');
            for (var i = 0; i < allScreens.length; i++) { allScreens[i].style.display = 'none'; }
            
            // Tampilkan target
            var target = document.getElementById(id);
            if(target) target.style.display = 'block';

            // Header Logic
            var header = document.getElementById('mainHeader');
            var fab = document.getElementById('fabPost');
            document.body.classList.remove('niaga-bg');

            if(id === 'screenLogin' || id === 'screenRegister' || id === 'screenReset') { header.style.display = 'none'; } 
            else {
                header.style.display = 'flex';
                if(id === 'screenNiaga' || id === 'screenToko') { header.className = 'header niaga-header'; if(id==='screenNiaga') document.body.classList.add('niaga-bg'); loadBanners(); } 
                else { header.className = 'header'; }
                if(id === 'screenNiaga') { fab.style.display = 'flex'; } else { fab.style.display = 'none'; }
            }
            toggleMenu(false);
        }

        function navigateTo(page) { window.location.hash = page; }
        window.onhashchange = () => { const page = window.location.hash.substring(1); if(page) renderPage(page); };
        function renderPage(page) {
            const map = { 'login': 'screenLogin', 'register': 'screenRegister', 'akun': 'screenAkun', 'kirim': 'screenKirim', 'kontak': 'screenKontak', 'admin': 'screenAdmin', 'niaga': 'screenNiaga', 'toko': 'screenToko' };
            let targetId = map[page] || (currentUser ? 'screenAkun' : 'screenLogin');
            showScreen(targetId);
            document.getElementById('headerTitle').innerText = page ? (page.charAt(0).toUpperCase() + page.slice(1)) : 'Akun';
            // Loaders
            if(page === 'akun' && currentUser) loadProfile();
            if(page === 'kontak') loadContacts();
            if(page === 'admin') { loadAdminData(); }
            if(page === 'kirim') { loadContacts(); renderAvailableContacts(); }
            if(page === 'niaga') loadFeed();
            if(page === 'toko') loadMyStore();
        }
        function navigateHome() { navigateTo('akun'); }
        function toggleMenu(state) { const popup = document.getElementById('menuPopup'); if(state === undefined) popup.classList.toggle('active'); else state ? popup.classList.add('active') : popup.classList.remove('active'); }

        // === 4. AUTH (Fixed Logout) ===
        async function logout() {
            currentUser = null; isActive = false; currentRole = 'user';
            try { localStorage.clear(); sessionStorage.clear(); } catch(e){}
            try { await _supabase.auth.signOut(); } catch(e){}
            forceStartApp(); // Paksa ke Login
            alert("Logout berhasil.");
        }
        
        async function handleLogin() { 
            const email = document.getElementById('loginEmail').value; const pass = document.getElementById('loginPass').value; 
            if(!email || !pass) return alert("Isi email & pass!");
            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password: pass }); 
                if (error) { alert("Login Gagal: " + error.message); return; } 
                currentUser = data.user; 
                const { data: profile } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single(); 
                if (profile) { currentRole = profile.role || 'user'; isActive = profile.is_active === true; isStoreActive = profile.is_store_active === true; } 
                setupUI(); 
            } catch(e) { alert("Error Koneksi"); }
        }
        
        _supabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') { currentUser = null; forceStartApp(); } });

        async function checkSession() { 
            try { 
                const { data: { user } } = await _supabase.auth.getUser(); 
                if (user) { currentUser = user; const { data: profile } = await _supabase.from('profiles').select('*').eq('id', user.id).single(); if (profile) { currentRole = profile.role; isActive = profile.is_active; isStoreActive = profile.is_store_active; } setupUI(); } 
                else { currentUser = null; setupUI(); } 
            } catch(e) { console.error(e); currentUser = null; setupUI(); } 
        }

        function setupUI() {
            const menuDiv = document.getElementById('dynamicMenu');
            const guestDiv = document.getElementById('akunGuest'); const userDiv = document.getElementById('akunUser');
            let menuHTML = '';
            if (!currentUser) {
                if(guestDiv) guestDiv.style.display = 'block'; if(userDiv) userDiv.style.display = 'none';
                menuHTML = '<span class="menu-item" onclick="navigateTo(\'niaga\')">Info Niaga</span>';
                renderPage('akun');
            } else {
                if(guestDiv) guestDiv.style.display = 'none'; if(userDiv) userDiv.style.display = 'block';
                if (currentRole === 'admin') { menuHTML = '<span class="menu-item" onclick="navigateTo(\'admin\')">Admin</span><span class="menu-item" onclick="navigateTo(\'niaga\')">Niaga</span><span class="menu-item" onclick="navigateTo(\'akun\')">Akun</span>'; renderPage('admin'); } 
                else { menuHTML = '<span class="menu-item" onclick="navigateTo(\'niaga\')">Niaga</span><span class="menu-item" onclick="navigateTo(\'kirim\')">Kirim</span><span class="menu-item" onclick="navigateTo(\'akun\')">Akun</span>'; renderPage('akun'); }
            }
            menuDiv.innerHTML = menuHTML;
        }

        // === 5. LOGIC FUNCTIONS (Abbreviated for stability) ===
        async function loadProfile() { if(!currentUser) return; const { data } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single(); if(data){ document.getElementById('profUsername').innerText = data.username; document.getElementById('profEmail').innerText = data.email; document.getElementById('profStatus').innerText = isActive ? "AKTIF" : "NON-AKTIF"; }}
        async function updateProfile() { const wa = document.getElementById('editWa').value; await _supabase.from('profiles').update({ wa_number: wa }).eq('id', currentUser.id); alert("Update sukses!"); }
        async function updatePassword() { const p = document.getElementById('editPass').value; if(!p) return; const { error } = await _supabase.auth.updateUser({ password: p }); alert(error ? "Gagal" : "Sukses!"); }
        async function deleteAccount() { if(confirm("Hapus?")){ await _supabase.from('profiles').delete().eq('id', currentUser.id); logout(); }}
        async function handleRegister() { const e = document.getElementById('regEmail').value, p = document.getElementById('regPass').value, u = document.getElementById('regUser').value; if(!e||!p||!u) return alert("Isi semua!"); const { error } = await _supabase.auth.signUp({ email: e, password: p, options: { data: { username: u } } }); if(error) alert(error.message); else alert("Sukses! Tunggu admin."); navigateTo('login'); }
        
        // Kontak
        async function loadContacts() { if(!currentUser) return; const { data } = await _supabase.from('contacts').select('*').eq('user_id', currentUser.id); allContacts = data || []; renderContacts(); renderAvailableContacts(); }
        function renderContacts() { const c = document.getElementById('contactListContainer'); c.innerHTML = allContacts.map(c => `<div class="contact-item"><b>${c.name}</b> (${c.phone}) <button class="btn-danger" style="width:auto;padding:2px 5px" onclick="deleteContact('${c.id}')">X</button></div>`).join(''); }
        async function addContact() { const n = document.getElementById('cName').value, p=document.getElementById('cPhone').value, l=document.getElementById('cLocation').value; if(!n||!p) return alert("Wajib isi!"); await _supabase.from('contacts').insert({ user_id: currentUser.id, name:n, phone:p, location:l }); loadContacts(); }
        async function deleteContact(id) { await _supabase.from('contacts').delete().eq('id', id); loadContacts(); }
        function renderAvailableContacts() { const c = document.getElementById('availableContactsList'); c.innerHTML = allContacts.map(c => `<div class="contact-item" onclick="addToSendList('${c.id}')">${c.name} <span style="font-size:10px">(${c.phone})</span></div>`).join(''); }
        function addToSendList(id) { const c = allContacts.find(x => x.id == id); if(sendList.find(x => x.id == id)) return; sendList.push(c); renderSendList(); }
        function renderSendList() { document.getElementById('countSend').innerText = sendList.length; document.getElementById('btnSendNext').style.display = sendList.length ? 'block' : 'none'; document.getElementById('sendListDisplay').innerHTML = sendList.map((c,i) => `<div class="contact-item">${i+1}. ${c.name} <button class="btn-primary" style="width:auto;padding:2px 5px" onclick="sendSingle(${i})">Kirim</button></div>`).join(''); }
        function sendNextInQueue() { if(!sendList.length) return; sendSingle(0); }
        function sendSingle(i) { const msg = document.getElementById('messageText').value; if(!msg) return alert("Pesan kosong"); const c = sendList[i]; window.open(`https://wa.me/${c.phone}?text=${encodeURIComponent(msg)}`, '_blank'); sendList.splice(i,1); renderSendList(); }

        // Niaga
        async function loadFeed() {
            const container = document.getElementById('feedContainer'); container.innerHTML = '<p style="text-align:center">Memuat...</p>';
            const { data: posts, error } = await _supabase.from('feed_posts').select(`id, title, description, images, created_at, wa_click_count, store_click_count, profiles ( id, username, raw_location, is_store_active, phone )`).eq('is_active', true).order('created_at', { ascending: false });
            if (error) { container.innerHTML = '<p style="color:red;text-align:center">Error memuat data.</p>'; return; }
            container.innerHTML = '';
            posts.forEach(p => {
                const u = p.profiles; 
                const card = document.createElement('div'); card.className = 'feed-card';
                card.onclick = () => openDetail(p, u);
                card.innerHTML = `<div class="feed-header"><div><b style="font-size:12px">${u.username||'Anonim'}</b><br><span style="font-size:10px;color:#666">${u.raw_location||'-'}</span></div></div>
                ${p.images && p.images.length ? `<div class="carousel-container"><div class="carousel-slide" id="slide-${p.id}">${p.images.map(img=>`<img src="${img}" loading="lazy">`).join('')}</div><div class="carousel-btn next" onclick="event.stopPropagation();moveSlide('${p.id}',1)">❯</div></div>` : ''}
                <div class="feed-body"><b>${p.title}</b><br><span style="font-size:12px;color:#555">${(p.description||'').substring(0,50)}...</span></div>
                <div class="feed-footer" onclick="event.stopPropagation()"><span style="font-size:10px">${p.wa_click_count} klik</span><button class="btn-wa" onclick="handleFeedWa('${p.id}','${u.phone}','${p.title}')">WhatsApp</button></div>`;
                container.appendChild(card);
            });
        }
        
        window.moveSlide = (id, dir) => { const s = document.getElementById(`slide-${id}`); if(!s) return; const w = s.offsetWidth; let curr = s.style.transform ? parseInt(s.style.transform.replace('translateX(','').replace('px)','')) : 0; let next = curr + (dir * -w); s.style.transform = `translateX(${next}px)`; };

        function openDetail(p, u) {
            currentDetailImages = p.images || []; currentDetailIndex = 0;
            document.getElementById('detailTitle').innerText = p.title;
            document.getElementById('detailDesc').innerText = p.description || '';
            const slider = document.getElementById('detailSlider');
            if(currentDetailImages.length > 0){ slider.innerHTML = currentDetailImages.map(img=>`<div class="detail-slide"><img src="${img}"></div>`).join(''); }
            document.getElementById('detailBtnWa').onclick = () => handleFeedWa(p.id, u.phone, p.title);
            document.getElementById('detailBtnStore').style.display = u.is_store_active ? 'inline-block' : 'none';
            document.getElementById('detailBtnStore').onclick = () => viewOtherStore(u.id);
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
        window.moveDetailSlide = (dir) => { if(currentDetailImages.length<=1) return; currentDetailIndex += dir; if(currentDetailIndex>=currentDetailImages.length) currentDetailIndex=0; if(currentDetailIndex<0) currentDetailIndex=currentDetailImages.length-1; updateDetailSlider(); };
        function updateDetailSlider() { document.getElementById('detailSlider').style.transform = `translateX(-${currentDetailIndex*100}%)`; }
        window.handleFeedWa = async (id, phone, title) => { await _supabase.rpc('increment_feed_counter', { post_id: id, column_name: 'wa' }); window.open(`https://wa.me/${phone}?text=Halo, tertarik: ${title}`); };
        window.viewOtherStore = async (uid) => { if(uid===currentUser.id){ navigateTo('toko'); return; } const { data: p } = await _supabase.from('profiles').select('*').eq('id',uid).single(); if(!p) return; document.getElementById('storeName').innerText = p.store_name||"Toko"; document.getElementById('storeWaBtn').onclick = () => window.open(`https://wa.me/${p.phone}`); loadProducts(uid, false); showScreen('screenToko'); closeDetailModal(); };
        
        async function loadMyStore() { if(!currentUser) return; const { data: p } = await _supabase.from('profiles').select('*').eq('id', currentUser.id).single(); if(!p.is_store_active){ alert("Toko belum aktif"); navigateTo('niaga'); return; } document.getElementById('storeName').innerText=p.store_name; document.getElementById('storeWaBtn').onclick=()=>window.open(`https://wa.me/${p.phone}`); loadProducts(currentUser.id, true); }
        async function loadProducts(uid, owner) { const c=document.getElementById('productContainer'); c.innerHTML='<p>Memuat...</p>'; const { data } = await _supabase.from('store_products').select('*').eq('user_id',uid); c.innerHTML = owner ? `<button class="btn-secondary" onclick="showProductModal()">+ Produk</button>` : ''; if(!data.length){ c.innerHTML+='<p style="text-align:center">Kosong</p>'; return; } data.forEach(p=>{ const img = (p.images&&p.images.length)?p.images[0]:'https://via.placeholder.com/150'; c.innerHTML+=`<div style="display:inline-block;width:45%;margin:1%;text-align:center"><img src="${img}" style="width:100%;height:80px;object-fit:cover;border-radius:8px"><h4 style="font-size:12px;margin:5px 0">${p.product_name}</h4><button class="btn-wa" style="font-size:10px;padding:3px 8px" onclick="handleProductWa('${p.id}','${uid}')">WhatsApp</button></div>`; }); }
        window.handleProductWa = async (id, uid) => { await _supabase.rpc('increment_product_counter',{prod_id:id}); const {data} = await _supabase.from('profiles').select('phone').eq('id',uid).single(); if(data) window.open(`https://wa.me/${data.phone}`); };
        
        // Post
        function showPostModal() { document.getElementById('modalTitle').innerText="Post"; document.getElementById('inputPrice').style.display='none'; document.getElementById('btnSubmit').innerText="Post"; document.getElementById('btnSubmit').onclick=submitPost; document.getElementById('postModal').style.display='flex'; }
        function showProductModal() { document.getElementById('modalTitle').innerText="Produk"; document.getElementById('inputPrice').style.display='block'; document.getElementById('btnSubmit').innerText="Simpan"; document.getElementById('btnSubmit').onclick=submitProduct; document.getElementById('postModal').style.display='flex'; }
        function closePostModal() { document.getElementById('postModal').style.display='none'; }
        
        window.submitPost = async function() { const t=document.getElementById('inputTitle').value, d=document.getElementById('inputDesc').value, files=document.getElementById('inputImages').files; if(!t) return alert("Judul wajib!"); let urls=[]; if(files.length){ for(let i=0;i<Math.min(files.length,3);i++){ const f=files[i]; if(f.size > 800000){ alert(`Gambar "${f.name}" > 800KB. Kompres dulu!`); return; } const name=Date.now()+f.name; const {data} = await _supabase.storage.from('product-images').upload(name,f); if(data) urls.push(_supabase.storage.from('product-images').getPublicUrl(data.path).data.publicUrl); } } await _supabase.from('feed_posts').insert({user_id:currentUser.id,title:t,description:d,images:urls,is_active:true}); alert("Sukses!"); closePostModal(); loadFeed(); };
        window.submitProduct = async function() { const t=document.getElementById('inputTitle').value, pr=document.getElementById('inputPrice').value, files=document.getElementById('inputImages').files; if(!t) return alert("Nama wajib!"); let urls=[]; if(files.length){ for(let i=0;i<Math.min(files.length,3);i++){ const f=files[i]; if(f.size>800000){ alert("Gambar > 800KB!"); return; } const name=Date.now()+f.name; const {data} = await _supabase.storage.from('product-images').upload(name,f); if(data) urls.push(_supabase.storage.from('product-images').getPublicUrl(data.path).data.publicUrl); } } await _supabase.from('store_products').insert({user_id:currentUser.id,product_name:t,price:pr,images:urls}); alert("Sukses!"); closePostModal(); loadProducts(currentUser.id,true); };

        // Misc
        async function loadAdminData() { const { data, count } = await _supabase.from('profiles').select('id, username, email, is_active', {count:'exact'}); document.getElementById('adminCount').innerText="Total: "+count; document.getElementById('adminUserList').innerHTML = data.map(u=>`<div class="contact-item">${u.email} (${u.username})</div>`).join(''); }
        function loadProvinsi() { fetch('https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json').then(r=>r.json()).then(d=>{ const s=document.getElementById('filterProvinsi'); d.forEach(p=>s.innerHTML+=`<option value="${p.name}">${p.name}</option>`); }); }
        async function loadBanners() { const { data } = await _supabase.from('site_settings').select('*'); if(data?.find(s=>s.key==='banner_enabled')?.value==='true'){ const { data:b } = await _supabase.from('banners').select('*').eq('is_active',true); if(b?.length){ document.getElementById('bannerFooter').classList.remove('hidden'); document.getElementById('bannerTrack').innerHTML = b.map(x=>`<img src="${x.image_url}" style="height:40px;margin:0 5px">`).join(''); } } }
        async function updateNewPassword() { const p = document.getElementById('newPass').value; if(!p) return; await _supabase.auth.updateUser({password:p}); alert("Ok"); logout(); }

        // === INIT ===
        loadProvinsi();
        checkSession();
    </script>
</body>
</html>
